  - width: 1/3
    sections:
      lista_sistemi:
        type: pages
        label: Cladding systems
        parent: site.find("sistemi-di-facciata")
        templates:
          - cladding-system
        layout: list
        info: "{{ page.testo_lv1.excerpt(80) }}"

