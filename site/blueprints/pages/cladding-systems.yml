title: Cladding systems

columns:

  - width: 2/3
    sections:
      intro:
        type: fields
        fields:
          page_title:
            label: Page title
            type: text
          cover_img:
            label: Image
            type: files
            max: 1
          intro_text:
            label: Text intro
            extends: fields/writer-basic

          seo_description:
            type: textarea
            label: Meta description (max 160 characters)
