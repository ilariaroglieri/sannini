title: Product

columns:
  - width: 1/2
    sections:
      intro_fields:
        type: fields
        fields:
          tech_drawing:
            label: Technical drawing
            type: files
            max: 1
            width: 1/2

          tech_drawing_mobile:
            label: Technical drawing (Mobile)
            type: files
            max: 1
            accepts:
              mime: image/*
            width: 1/2

          intro_text:
            extends: fields/writer-basic

          blocks:
            label: Blocks
            type: blocks
            fieldsets:
              - text-block
              - 3-col-text-block
              - img-block

  - width: 1/2
    sections:

      tech_sheet:
        type: fields
        label: Technical data
        fields:
          cover_img:
            label: Preview image
            type: files
            max: 1
            accepts:
              mime: image/*

          design:
            label: Design
            type: text
            help: 'If present it will be shown inside the main Products page.'

          measures:
            label: Size
            type: text
            width: 1/2

          weight:
            label: Weight
            type: text
            width: 1/2

          finishing:
            label: Finishing
            type: text
            help: 'If present it will have priority over the 3 fields below.'

          finishing_front:
            label: Finishing front
            type: text
            width: 1/3

          finishing_back:
            label: Finishing back
            type: text
            width: 1/3

          coste:
            label: Edges
            type: text
            width: 1/3

          variables:
            label: Colors
            type: structure
            columns:
              title:
                width: 1/1
            fields:
              title:
                label: Title
                type: text
              image:
                label: Image
                type: files
                max: 1
                help: 'Please upload a square image without border.'

      download_section:
        type: fields
        label: Download
        fields:
          pdf:
            label: PDF
            type: files
            max: 1
            accepts:
              mime: application/pdf




