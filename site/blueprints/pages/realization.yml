title: Realization

columns:
  - width: 2/3
    sections: 
      contents:
        type: fields
        fields:
          hero_img:
            label: Hero image (optional)
            type: files
            max: 1

          subtitle:
            label: Subtitle
            type: text

          intro_text:
            label: Intro text
            extends: fields/writer-basic

          blocks:
            label: Blocks
            type: blocks
            fieldsets:
              - text-block
              - 3-col-text-block
              - img-block

          credits:
            label: Credits
            type: structure
            columns:
              title:
                width: 1/2
              info:
                width: 1/2
            fields:
              title:
                label: Title
                type: text
              info:
                label: Contents
                extends: fields/writer-basic

  - width: 1/3
    sections:
      intro_fields:
        type: fields
        fields:
          cover_img:
            label: Cover image
            type: files
            max: 1

          realization_caption:
            label: Realization info
            extends: fields/writer-basic


