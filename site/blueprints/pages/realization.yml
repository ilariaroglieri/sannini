title: Realizzazione

columns:
  - width: 2/3
    sections: 
      contents:
        type: fields
        fields:
          hero_img:
            label: Immagine di apertura (opzionale)
            type: files
            max: 1

          subtitle:
            label: Sottotitolo
            type: text

          intro_text:
            label: Testo intro
            extends: fields/writer-basic

          blocks:
            label: Blocchi
            type: blocks
            fieldsets:
              - text-block
              - 3-col-text-block
              - img-block

          credits:
            label: Crediti
            type: structure
            columns:
              title:
                width: 1/2
              info:
                width: 1/2
            fields:
              title:
                label: Titolo
                type: text
              info:
                label: Contenuti
                extends: fields/writer-basic

  - width: 1/3
    sections:
      intro_fields:
        type: fields
        fields:
          cover_img:
            label: Immagine di anteprima
            type: files
            max: 1

          realization_caption:
            label: Info realizzazione
            extends: fields/writer-basic


