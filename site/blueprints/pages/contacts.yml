title: Contacts

columns:
  - width: 1/2
    sections:
      basic_info:
        type: fields
        label: Contacts
        help: "These data are used also inside the footer."
        fields:
          address:
            label: Address
            type: textarea
            rows: 3

          phome:
            label: Telephone
            type: textarea

          email:
            label: Email
            type: email

          instagram:
            label: Instagram
            type: url
            placeholder: "https://instagram.com/..."

  - width: 1/2
    sections:
      additional_info:
        type: fields
        label: Other info
        fields:
          departments:
            type: structure
            columns:
              title:
                width: 1/2
              email:
                width: 1/2
            fields:
              title:
                label: Title
                type: text
              email:
                label: Email
                type: email
